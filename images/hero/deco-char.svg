<svg width="200" height="240" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wbg" x1="100" y1="0" x2="100" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a9fd5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3a9fd5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ── 브라우저 창 외곽 ── -->
  <rect x="8" y="8" width="184" height="224" rx="18" stroke="#3a9fd5" stroke-width="7" fill="url(#wbg)"/>

  <!-- ── 타이틀 바 구분선 ── -->
  <line x1="8" y1="50" x2="192" y2="50" stroke="#3a9fd5" stroke-width="5" opacity="0.7"/>

  <!-- ── 닫기 / 최소화 / 최대화 버튼 ── -->
  <circle cx="34"  cy="29" r="7" stroke="#ffe066" stroke-width="5" fill="rgba(255,224,102,0.20)"/>
  <circle cx="56"  cy="29" r="7" stroke="white"   stroke-width="4" fill="rgba(255,255,255,0.10)" opacity="0.55"/>
  <circle cx="78"  cy="29" r="7" stroke="#3a9fd5"  stroke-width="4" fill="rgba(58,159,213,0.12)"/>

  <!-- ── URL 바 ── -->
  <rect x="96" y="17" width="86" height="24" rx="9"
        stroke="rgba(255,255,255,0.28)" stroke-width="3"
        fill="rgba(255,255,255,0.06)"/>
  <!-- URL 내 점 3개 -->
  <circle cx="116" cy="29" r="2.5" fill="rgba(255,255,255,0.45)"/>
  <circle cx="129" cy="29" r="2.5" fill="rgba(255,255,255,0.45)"/>
  <circle cx="142" cy="29" r="2.5" fill="rgba(255,255,255,0.45)"/>

  <!-- ── 코드 라인들 ── -->
  <!-- <html> -->
  <line x1="26" y1="72"  x2="88"  y2="72"  stroke="#ffe066" stroke-width="5" stroke-linecap="round"/>
  <!-- <head>...</head> -->
  <line x1="26" y1="92"  x2="150" y2="92"  stroke="#3a9fd5" stroke-width="5" stroke-linecap="round"/>
  <!-- 들여쓰기 1 -->
  <line x1="46" y1="112" x2="164" y2="112" stroke="white"   stroke-width="4" stroke-linecap="round" opacity="0.50"/>
  <!-- 들여쓰기 2 (강조) -->
  <line x1="46" y1="132" x2="128" y2="132" stroke="#ffe066" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <!-- 들여쓰기 3 -->
  <line x1="66" y1="152" x2="156" y2="152" stroke="#3a9fd5" stroke-width="4" stroke-linecap="round"/>
  <!-- 들여쓰기 2 닫기 -->
  <line x1="46" y1="172" x2="106" y2="172" stroke="white"   stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <!-- </body> -->
  <line x1="26" y1="192" x2="92"  y2="192" stroke="#3a9fd5" stroke-width="5" stroke-linecap="round"/>
  <!-- </html> -->
  <line x1="26" y1="212" x2="76"  y2="212" stroke="#ffe066" stroke-width="4" stroke-linecap="round" opacity="0.80"/>

  <!-- ── 커서 (깜빡이는 캐럿) ── -->
  <rect x="80" y="204" width="5" height="16" rx="2" fill="#ffe066" opacity="0.90"/>
</svg>
